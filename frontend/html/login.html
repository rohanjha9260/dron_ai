<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dron-AI Unified Student Portal — Login, Registration, and Instant Guest Access">
    <title>Dron-AI | Unified Student Portal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/legal.css">
</head>
<body>
    <!-- Accessibility Skip Link -->
    <a href="#unified-auth-container" class="skip-to-content">Skip to authentication portal</a>

    <div class="auth-container" id="unified-auth-container" role="main">
        <div class="auth-card" id="auth-main-card">
            
            <!-- Auth Header -->
            <div class="auth-header">
                <a href="index.html" class="auth-logo-badge" title="Back to Dron-AI Home">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </a>
                <h1>Dron-AI</h1>
                <p>Intelligent Student Career Platform</p>
                <span class="auth-tag" id="auth-header-tag">Student Portal</span>
            </div>

            <!-- Segmented Mode Tabs: Sign In / Sign Up -->
            <div class="auth-tabs" role="tablist" aria-label="Authentication Options">
                <button type="button" class="auth-tab-btn active" id="tab-login-btn" role="tab" aria-selected="true" aria-controls="panel-login">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Sign In</span>
                </button>
                <button type="button" class="auth-tab-btn" id="tab-register-btn" role="tab" aria-selected="false" aria-controls="panel-register">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Sign Up</span>
                </button>
            </div>

            <!-- TAB PANEL 1: Sign In -->
            <div class="auth-tab-panel active" id="panel-login" role="tabpanel" aria-labelledby="tab-login-btn">
                <form id="login-form" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <div class="input-with-icon">
                            <input type="email" id="login-email" name="email" placeholder="student@university.edu" required autocomplete="email">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect width="20" height="16" x="2" y="4" rx="2"/>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="input-with-icon">
                            <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <button type="button" class="password-toggle-btn" data-target="login-password" aria-label="Toggle password visibility">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div id="login-error" class="error-message" style="display: none;" role="alert"></div>

                    <button type="submit" id="login-submit-btn" class="btn btn-primary">
                        <span>Sign In</span>
                    </button>
                </form>

                <div class="auth-switch-prompt">
                    <span>Don't have an account?</span>
                    <button type="button" class="btn-link-switch" id="switch-to-register-link">Create Account</button>
                </div>
            </div>

            <!-- TAB PANEL 2: Sign Up (Register) -->
            <div class="auth-tab-panel" id="panel-register" role="tabpanel" aria-labelledby="tab-register-btn">
                <form id="register-form" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <div class="input-with-icon">
                            <input type="text" id="reg-name" name="full_name" placeholder="Alex Morgan" required autocomplete="name">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <div class="input-with-icon">
                            <input type="email" id="reg-email" name="email" placeholder="alex@university.edu" required autocomplete="email">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect width="20" height="16" x="2" y="4" rx="2"/>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <div class="input-with-icon">
                            <input type="password" id="reg-password" name="password" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <button type="button" class="password-toggle-btn" data-target="reg-password" aria-label="Toggle password visibility">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="reg-cohort">Cohort Year (Optional)</label>
                            <div class="input-with-icon">
                                <input type="number" id="reg-cohort" name="cohort_year" placeholder="2026" min="2000" max="2099">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                                    <line x1="16" x2="16" y1="2" y2="6"/>
                                    <line x1="8" x2="8" y1="2" y2="6"/>
                                    <line x1="3" x2="21" y1="10" y2="10"/>
                                </svg>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="reg-branch">Academic Branch (Optional)</label>
                            <div class="input-with-icon">
                                <select id="reg-branch" name="academic_branch">
                                    <option value="">Select Branch</option>
                                    <option value="Computer Science & Engineering">Computer Science &amp; Engineering</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Electronics & Communication">Electronics &amp; Communication</option>
                                    <option value="Electrical Engineering">Electrical Engineering</option>
                                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                                    <option value="Civil Engineering">Civil Engineering</option>
                                    <option value="AI & Data Science">AI &amp; Data Science</option>
                                </select>
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                                    <path d="M6 6h10"/>
                                    <path d="M6 10h10"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Explicit DPDP Act 2023 Consent Checkbox (Only necessary data processed) -->
                    <div class="form-group form-consent-group">
                        <label class="checkbox-label" for="reg-consent">
                            <input type="checkbox" id="reg-consent" name="consent" required>
                            <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> and acknowledge the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a> (compliant with DPDP Act 2023). Only necessary academic and technical profile data is processed.</span>
                        </label>
                    </div>

                    <div id="register-error" class="error-message" style="display: none;" role="alert"></div>
                    <div id="register-success" class="success-message" style="display: none;" role="status"></div>

                    <button type="submit" id="register-submit-btn" class="btn btn-primary">
                        <span>Create Account</span>
                    </button>
                </form>

                <div class="auth-switch-prompt">
                    <span>Already have an account?</span>
                    <button type="button" class="btn-link-switch" id="switch-to-login-link">Sign In</button>
                </div>
            </div>

            <!-- OPTION 3: Guest User (Quick Dev Mode) -->
            <div class="auth-divider">
                <span>or explore without credentials</span>
            </div>

            <button type="button" id="guest-login-btn" class="btn-guest-dev" aria-label="Continue as Guest (Dev Mode)">
                <div class="guest-dev-main">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>Continue as Guest (Dev Mode)</span>
                </div>
                <div class="guest-dev-subtext">
                    <span class="guest-dev-badge">Instant</span>
                    <span>Preloaded demo profile &bull; 1-click evaluation access</span>
                </div>
            </button>

            <!-- Back to landing link & Legal links -->
            <div class="auth-footer">
                <a href="index.html" class="auth-back-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Home</span>
                </a>
                <div style="margin-top: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 0.75rem; color: #94A3B8;">
                    <a href="privacy.html" style="color: #64748B;">Privacy Policy</a>
                    <span>&bull;</span>
                    <a href="terms.html" style="color: #64748B;">Terms of Service</a>
                    <span>&bull;</span>
                    <a href="cookies.html" style="color: #64748B;">Cookie Policy</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Client-side API & Auth Script Modules -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cookie_consent.js"></script>
</body>
</html>
