<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dron-AI | Student Registration</title>
    <script>
        // Smoothly redirect to Unified Authentication Portal on the Sign Up tab
        (function() {
            const params = new URLSearchParams(window.location.search);
            params.set("tab", "signup");
            window.location.replace("login.html?" + params.toString());
        })();
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F8FAFC; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; color: #64748B;">
        <p>Redirecting to Unified Registration Portal...</p>
        <p><a href="login.html?tab=signup" style="color: #16A34A; font-weight: 600;">Click here if you are not redirected automatically</a></p>
    </div>
</body>
</html>
